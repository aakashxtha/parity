name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --timeout 30

      - name: Smoke test – help
        run: parity --help

      - name: Smoke test – check inline PDB
        run: |
          python - <<'EOF'
          import tempfile, os, subprocess, sys, textwrap
          pdb = textwrap.dedent("""\
              ATOM      1  N   ALA A   1       1.000   2.000   3.000  1.00  0.00           N
              ATOM      2  CA  ALA A   1       2.000   2.000   3.000  1.00  0.00           C
              ATOM      3  C   ALA A   1       3.000   2.000   3.000  1.00  0.00           C
              ATOM      4  O   ALA A   1       3.000   3.000   3.000  1.00  0.00           O
              ATOM      5  CB  ALA A   1       2.000   1.000   3.000  1.00  0.00           C
              END
          """)
          with tempfile.NamedTemporaryFile(suffix=".pdb", mode="w", delete=False) as f:
              f.write(pdb)
              path = f.name
          try:
              r = subprocess.run(["parity", "check", path], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr, file=sys.stderr)
                  sys.exit(r.returncode)
              print("smoke test passed")
          finally:
              os.unlink(path)
          EOF
