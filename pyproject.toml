[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdbparity"
version = "0.1.0"
description = "Fast, read-only CLI for auditing and comparing PDB/mmCIF structure files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["bioinformatics", "structural-biology", "pdb", "mmcif", "molecular-dynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "gemmi>=0.6",
    "typer[all]>=0.9",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout"]

[project.scripts]
parity = "parity.cli:app"

[project.urls]
Repository = "https://github.com/aakashxtha/parity"
Issues = "https://github.com/aakashxtha/parity/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]
